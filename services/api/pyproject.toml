[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "financial-tracker-api"
version = "0.1.0"
description = "Local API and agent worker for Financial Tracker"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.128,<1",
  "uvicorn[standard]>=0.40,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.18,<2",
  "pytest>=8.4,<10",
  "ruff>=0.13,<1",
]

[project.scripts]
financial-tracker = "financial_tracker_api.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/financial_tracker_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["financial_tracker_api"]
mypy_path = "src"
